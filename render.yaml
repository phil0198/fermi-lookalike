# Render Blueprint (free): New > Blueprint > pick this repo.
# Guesses are stored in a free Turso database, because free Render
# instances have no persistent disk. Render asks for the two Turso
# values when you create the Blueprint.
services:
  - type: web
    name: ballpark
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TRUST_PROXY
        value: "1"
